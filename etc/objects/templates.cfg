# Generic templates shared by hosts and services.
define host{
    name                    generic-host
    notifications_enabled   0
    event_handler_enabled   1
    flap_detection_enabled   0
    process_perf_data       1
    retain_status_information 1
    retain_nonstatus_information 1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    contacts                nagiosadmin
    register                0
}

define service{
    name                    generic-service
    active_checks_enabled   1
    passive_checks_enabled   1
    parallelize_check       1
    obsess_over_service     0
    check_freshness         0
    notifications_enabled   0
    event_handler_enabled   1
    flap_detection_enabled  0
    process_perf_data       1
    retain_status_information 1
    retain_nonstatus_information 1
    max_check_attempts      3
    check_interval          1
    retry_interval          1
    check_period            24x7
    notification_period     24x7
    contacts                nagiosadmin
    register                0
}

# Standard sample host templates installed with Nagios Core.
define host{
    name                    windows-server
    use                     generic-host
    check_period            24x7
    check_command           check_tcp!12489
    notification_period     24x7
    notification_options    d,r
    hostgroups              windows-servers
    register                0
}

define host{
    name                    generic-printer
    use                     generic-host
    check_period            24x7
    check_command           check-host-alive
    notification_period     workhours
    notification_options    d,r
    hostgroups              network-printers
    register                0
}

define host{
    name                    generic-switch
    use                     generic-host
    check_period            24x7
    check_command           check-host-alive
    notification_period     24x7
    notification_options    d,r
    hostgroups              switches
    register                0
}
