}

define command{
    command_name    check_ssh
    command_line    /usr/lib/nagios/plugins/check_ssh $ARG1$ $HOSTADDRESS$
}

define command{
    command_name    check_dhcp
    command_line    /usr/lib/nagios/plugins/check_dhcp $ARG1$
}

define command{
    command_name    check_ping
    command_line    /usr/lib/nagios/plugins/check_ping -H $HOSTADDRESS$ -w $ARG1$ -c $ARG2$ -p 5
}

define command{
    command_name    check_service
    command_line    /usr/lib/nagios/plugins/check_service -s $ARG1$
}

define command{
    command_name    check_pop
    command_line    /usr/lib/nagios/plugins/check_pop -H $HOSTADDRESS$ $ARG1$
}

define command{
    command_name    check_imap
