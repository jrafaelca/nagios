###############################################################################
# Standard Windows host example.
###############################################################################

define host {
    use                     windows-server
    host_name               winserver
    alias                   My Windows Server
    address                 192.168.1.2
}

define service {
    use                     generic-service
    host_name               winserver
    service_description     NSClient++ Version
    check_command           check_nt!CLIENTVERSION
}

define service {
    use                     generic-service
    host_name               winserver
    service_description     Uptime
    check_command           check_nt!UPTIME
}

define service {
    use                     generic-service
    host_name               winserver
    service_description     CPU Load
    check_command           check_nt!CPULOAD!-l 5,80,90
}

define service {
    use                     generic-service
    host_name               winserver
    service_description     Memory Usage
    check_command           check_nt!MEMUSE!-w 80 -c 90
}
