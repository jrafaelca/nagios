###############################################################################
# Standard network switch host example.
###############################################################################

define host {
    use                     generic-switch
    host_name               linksys-srw224p
    alias                   Linksys SRW224P
    address                 192.168.1.1
}

define service {
    use                     generic-service
    host_name               linksys-srw224p
    service_description     PING
    check_command           check_ping!3000.0,80%!5000.0,100%
    check_interval          5
    retry_interval          1
}
