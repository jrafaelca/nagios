# Demo host and services so the UI has something useful on first boot.
define host{
    use                     generic-host
    host_name               localhost
    alias                   Localhost
    address                 127.0.0.1
    hostgroups              localhost
    check_command           check-host-alive
}

define service{
    use                     generic-service
    host_name               localhost
    service_description     Root Partition
    check_command           check_local_disk!20%!10%!/
}

define service{
    use                     generic-service
    host_name               localhost
    service_description     Current Users
    check_command           check_local_users!20!50
}

define service{
    use                     generic-service
    host_name               localhost
    service_description     Total Processes
    check_command           check_local_procs!250!400!RSZDT
}

define service{
    use                     generic-service
    host_name               localhost
    service_description     Current Load
    check_command           check_local_load!5.0,4.0,3.0!10.0,6.0,4.0
}

define service{
    use                     generic-service
    host_name               localhost
    service_description     HTTP
    check_command           check_http
    notifications_enabled   0
}
