# Demo host and service so the UI has something to show immediately.
define host{
    use         generic-host
    host_name   localhost
    alias       Localhost
    address     127.0.0.1
    check_command check_local_ping
}

define service{
    use                 generic-service
    host_name           localhost
    service_description HTTP
    check_command       check_local_http
}
